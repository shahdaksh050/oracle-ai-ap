services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: oracle_ap
      POSTGRES_USER: ap_admin
      POSTGRES_PASSWORD: admin_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap_admin -d oracle_ap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    environment:
      AP_ADMIN_DSN: "postgresql://ap_admin:admin_secure_pass@db:5432/oracle_ap"
      AP_CONFIG: "/app/.runtime/app.json"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - app_runtime:/app/.runtime

volumes:
  pgdata:
  app_runtime:
